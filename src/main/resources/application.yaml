spring:
  config:
    import: optional:file:.env[.properties]

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope: email, profile
            redirect-uri: "{baseUrl}/api/auth/oauth2/callback/{registrationId}"
            authorization-grant-type: authorization_code
          kakao:
            client-id: ${KAKAO_CLIENT_ID:your-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:your-kakao-client-secret}
            scope: profile_nickname, account_email
            redirect-uri: "{baseUrl}/api/auth/oauth2/callback/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      enabled: true  # ???? ??? ?? ??
      max-file-size: 10MB
      max-request-size: 50MB
      location: /tmp  # ?? ?? (??? OS ???)

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    # show-sql: true
    properties:
      hibernate:
        highlight_sql: true
        use_sql_comments: true
  devtools:
    restart:
      enabled: true     # spring boot ?????? ??? ???
    livereload:
      enabled: true # ???? ?? ?? ????

springdoc:
  swagger-ui:
    # 접속 경로를 http://localhost:8080/swagger 로 변경
    path: /swagger
  # API 그룹화나 정렬 설정
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

jwt:
  secretKey: ${JWT_SECRET_KEY:secretKey}
  # accessTokenExpiration,
  access_token_expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh_token_expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:3600000}

storage:
  type: s3


logging:
  level:
    org.hibernate.sql: debug # (Show-sql: true)
    org.hibernate.orm.jdbc.bind: trace
#    org.springframework.web.servlet.mvc.method.annotation: TRACE
aws:
  s3:
    accesskey: ${AWS_ACCESS_KEY}
    secretkey: ${AWS_SECRET_ACCESS_KEY}
    bucket: ${AWS_BUCKET}
    region: ${AWS_REGION}
#    org.springframework.http.converter: TRACE